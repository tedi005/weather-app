{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"> 
    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'app/css/styles.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'app/css/see_more.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'app/css/weather.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'app/css/delete.css' %}">
    <!-- Favicon -->
    <link rel="shortcut icon" type="image/png" href="{% static 'app/favicon/favicon.png' %}" >
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Luxon -->
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js" integrity="sha256-7NQm0bhvDJKosL8d+6ZgSi2LxZCIcA/TD087GLEBO9M=" crossorigin="anonymous"></script>
</head>
<body>
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <div class="clock">
        <span id="hrs">00</span>
        <span>:</span>
        <span id="min">00</span>
        <span id="am"></span>
    </div>

    <form method="POST" class="form">
        {% csrf_token %}
        <input class="form-control" type="text" name="user_data" placeholder="Search City" aria-label="Search">
        <div class="button-container">
            <button type="submit" value="Submit" class="btn btn-outline-dark">Submit</button>
            <!-- <button type="submit" value="Submit" name="current-location" class="btn btn-outline-dark">Get Current Weather</button> -->
            <button type="submit" value="Submit" name="current-location" class="btn btn-outline-dark">
                <i class="fa-solid fa-location-dot"></i>
            </button>
        </div>
        
    </form>
        <div class="container">
        {% if weather_data %}
            {% include 'weather.html' with weather_data=weather_data %}
        {% endif %}
    </div>
    <script src="{% static 'app/js/time_date2.js'%}"></script>
</body>
</html>
