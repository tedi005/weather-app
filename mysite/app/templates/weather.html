{%load static %}
<link rel="stylesheet" type="text/css" href="{% static 'app/css/weather.css' %}">
{% if weather_data %}
    {% for weather in weather_data %}
        <div class="weather-results">
            <div class="icon-container">
                <button id="myBtn-{{ weather.city }}" data-city="{{ weather.city }}">View Details</button>
                <p id="local-time-{{ weather.city }}"></p>
                <button id="delete-button-{{ weather.city }}" class="button-danger">Delete</button>
            </div>
            <h2>{{ weather.city | title }}</h2>
            <p> {{ weather.temperature }}°C</p>
            <p> {{ weather.description }}</p>
            <img src="http://openweathermap.org/img/wn/{{ weather.icon }}.png" alt="Weather icon">
        </div>
    {% endfor %}
{% endif %}

<!-- Modal container -->
<div id="delete-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <span class="close-button">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>


<!-- Modal container2 -->
<div id="delete-modal2" class="modal" style="display:none;">
    <div class="modal-content2">
        <button class="close-button2">Close</button>
        <div id="modal-body2"></div>
    </div>
</div>

<style>

/* The Modal (background) */
.modal {
  display: none; /* Hidden by default */
  position: fixed; /* Stay in place */
  z-index: 1; /* Sit on top */
  padding-top: 100px; /* Location of the box */
  left: 0;
  top: 0;
  width: 100%; /* Full width */
  height: 100%; /* Full height */
  overflow: auto; /* Enable scroll if needed */
  background-color: rgb(0,0,0); /* Fallback color */
  background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
}

/* Modal Content */
.modal-content {
    .modal {
    display: none; 
    position: fixed; 
    z-index: 1; 
    left: 0;
    top: 0;
    width: 100%; 
    height: 100%; 
    overflow: auto; 
    background-color: rgb(0,0,0); 
    background-color: rgba(0,0,0,0.4); 
}

.modal-content {
    background-color: #fefefe;
    margin: 15% auto; 
    padding: 20px;
    border: 1px solid #888;
    border-radius: 15px; 
    width: 80%; 
    width: 350px;
    height: 150px;
}

}
.close-button {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
}

.close-button:hover,
.close-button:focus {
    color: black;
    text-decoration: none;
    cursor: pointer;
    
}

.icon-container {
display: flex;
align-items: center;
justify-content: space-between; /* Adjusts the spacing between items */
gap: 10px; /* Adds space between elements */

}
.icon-container button {
    width: 100px; /* Set a fixed width for the buttons */
    margin: 0;
}

.icon-container button {
    margin: 0;
}
</style>



<!-- modal 2 -->
 <style>
    .modal-content2 {
  background-color: #fefefe;
  margin: auto;
  padding: 20px;
  border: 1px solid #888;
  width: 70%;
  height: 650px;
}
 </style>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const DateTime = luxon.DateTime;

        var modal = document.getElementById("delete-modal2");
        var modalBody = document.getElementById("modal-body2");
        var closeButton = document.getElementsByClassName("close-button2")[0];

        // Get the weather data from Django
        const weatherData = {{ weather_data|safe }};

        // Attach click event to each delete button dynamically
        weatherData.forEach(weather => {
            const button = document.getElementById(`myBtn-${weather.city}`);
            if (button) {
                button.addEventListener('click', function (event) {
                    event.preventDefault(); // Prevent default link behavior

                    // Set the modal content dynamically based on the city
                    modalBody.innerHTML = `
                        <h5>${weather.city}, ${weather.country} , <img src="http://openweathermap.org/img/wn/${weather.icon}.png"> </h5>
                        <p>Lon: ${weather.lon}, Lat: ${weather.lat}</p>
                        <p>Main: ${weather.main} km,</p><p>Description: ${weather.description}</p>

                        <p>Temp: ${weather.temperature}°C, Feels Like: ${weather.feels_like}°C, Min Temp: ${weather.temp_min}°C, Max Temp: ${weather.temp_max}°C, Min Temp: ${weather.temp_min}°C</p>
                        <p>Pressure: ${weather.pressure} hPa, Humidity: ${weather.humidity}%, sea_level: ${weather.sea_level} km, Ground level: ${weather.grnd_level} km</p>
                        <p>Visibility: ${weather.visibility} km</p>
                        <p>Wind Speed: ${weather.wind_speed} m/s, Wind Direction: ${weather.wind_deg}°</p>
                        <p>Description: ${weather.description}</p>
                        <p>timezone: ${weather.timezone}</p>
                        <p>Clouds: ${weather.clouds} %</p>
                       
                        <!-- <button type="button" onclick="window.location.href='{% url 'index' %}'" class="btn btn-secondary">Cancel</button>  -->
                    `;

                    // Display the modal
                    modal.style.display = 'block';
                });
            }
        });

        // Close the modal when the close button is clicked
        closeButton.onclick = function () {
            modal.style.display = "none";
        };

        // Close the modal when the user clicks outside the modal
        window.onclick = function (event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        };

    });
</script>
