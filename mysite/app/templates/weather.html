{%load static %}

<!-- <script src="{% static 'app/js/modal.js' %}"></script> -->
{% if weather_data %}
    {% for weather in weather_data %}
        <div class="weather-results">
            <div class="icon-container">
                <button id="myBtn-{{ weather.city }}" data-city="{{ weather.city }}" class="btn btn-outline-dark">
                    <i class="fa-solid fa-eye"></i>     
                </button>
                <!-- <button id="openModalBtn{{ weather.city }}">Open Modal</button> -->
                <p id="local-time-{{ weather.city }}"></p>
                <button id="delete-button-{{ weather.city }}" class="btn btn-outline-dark">Delete</button>
            </div>
            <div class="data-container">
                <h2>{{ weather.city | title }}</h2>
                <p> {{ weather.temperature }}°C</p>
                <p> {{ weather.description }}</p>
                <img src="http://openweathermap.org/img/wn/{{ weather.icon }}.png" alt="Weather icon">
            </div>
        </div>
    {% endfor %}
{% endif %}

<!-- Delete Modal container -->
<div id="delete-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <!-- <span class="close-button">&times;</span> -->
        <!-- <span class="close-button">Close</span> -->
        <div id="modal-body"></div>
    </div>
</div>

<!-- See more Modal container -->
<div id="delete-modal2" class="modal" style="display:none;">
    <div class="modal-content2">
        <!-- <button class="close-button2">Close</button> -->
        <div id="modal-body2"></div>
    </div>
</div>




<script src="{% static 'app/js/time_date.js' %}"></script>
<script src="{% static 'app/js/see_more.js' %}"></script>
<script src="{% static 'app/js/delete.js' %}"></script>
